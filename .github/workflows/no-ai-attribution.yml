name: No AI attribution

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject AI names and identities in history, branch and PR text
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          bad=$(git log --format='@@%h %an %ae %cn %ce%n%B' HEAD | awk '/^@@/{s=substr($1,3)} tolower($0)~/claude|anthropic/{print s}' | sort -u)
          if [ -n "$bad" ]; then echo "Banned word or identity in: $bad"; exit 1; fi
          if printf '%s\n' "$BRANCH" "$TITLE" "$BODY" | grep -qiE 'claude|anthropic'; then echo "Banned word in branch or PR text"; exit 1; fi
